# interpolation: the key=value block at the top of the file (before the first
# [section] header) is the "unnamed section". `${name}` reads a variable from
# there, `${section:name}` from a named section, `${env:name}` from an [env]
# section or the environment. `$$` stays `$$`, only `$${` writes a literal `${`.
# user=user2
# pass=pa$word

[imapbox]
local_folder=
days=10
wkhtmltopdf=/usr/bin/wkhtmltopdf

[account1]
host=imap.googlemail.com
username=
password=
remote_folder=
port=993

